<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>迷冥市役所 都市伝説課｜ふたりの記録</title><style>
:root{font-family:'Yu Gothic Medium','Yu Gothic','Hiragino Kaku Gothic ProN',sans-serif;color:#30332f;background:#f7f5ec}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#e8f0e2,#faf8ef 48%,#ece7f1);min-height:100vh}main{max-width:790px;margin:auto;padding:24px 15px 70px}.hero{text-align:center;padding:30px 5px;border-bottom:1px solid #b8c6b8}.eyebrow{font-size:11px;letter-spacing:.23em;color:#687e6b}h1{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;font-size:clamp(25px,6vw,39px);font-weight:500;margin:12px 0}h2{font-size:17px;margin:0 0 12px}.sub{color:#72766e;font-size:12px;line-height:1.8}.panel{background:#fffef9ed;border:1px solid #cbd3c6;border-radius:14px;padding:17px;margin:14px 0;box-shadow:0 5px 22px #3040320a}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between}.btn,button,select{font:inherit}button,select{border:1px solid #a9bca7;border-radius:9px;background:#eef4e9;color:#344d3b;padding:10px 12px;cursor:pointer}button:disabled{opacity:.5}button.primary{background:#47654f;color:white;border-color:#47654f}button.rose{background:#f8e8eb;border-color:#cb9eaa;color:#8c4763}button.small{font-size:12px;padding:7px 9px}.controls{display:flex;flex-wrap:wrap;gap:8px}.hidden{display:none!important}.story{white-space:pre-wrap;line-height:2.05;font-size:15px;min-height:110px}.eventtitle{font-family:'Yu Mincho','Hiragino Mincho ProN',serif;font-size:21px;margin-bottom:12px}.important{border-left:5px solid #b76b85}.important .eventtitle,.important .story{font-family:'Yu Mincho','Hiragino Mincho ProN',serif}.important .story{font-size:17px}.romance{border-left-color:#b36b83}.romance .eventtitle{color:#a85471}.conflict{border-left-color:#9990ae}.conflict .eventtitle{color:#827590}.danger{border-left-color:#b54b50}.danger .eventtitle{color:#b13f46}.barrow{display:grid;grid-template-columns:75px 1fr 33px;align-items:center;gap:9px;margin:10px 0;font-size:12px}.track{background:#e4e8df;height:8px;border-radius:8px;overflow:hidden}.fill{height:100%;background:#a8c2a4;transition:width .35s}.fill.love{background:#b96c8a}.fill.stress{background:#b94b51}.fill.conflict{background:#a39ab6}.log{max-height:310px;overflow:auto}.entry{border-bottom:1px solid #e8e9e1;padding:10px 0;font-size:13px;line-height:1.7}.entry b{font-family:'Yu Mincho',serif}.entry.romance b{color:#a85471}.entry.conflict b{color:#827590}.entry.danger b{color:#b13f46}.badge{display:inline-block;border:1px solid #c4d0c0;border-radius:99px;padding:4px 9px;font-size:11px;background:#f1f5ec}.choices{display:grid;gap:8px;margin-top:14px}.choices button{text-align:left;background:#fff}.footer{text-align:center;font-size:11px;color:#777e76;margin-top:24px}label{font-size:13px;display:block;margin:10px 0}input[type=checkbox]{accent-color:#69846c}#notice{font-size:12px;color:#9b4d65}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:450px){.two{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><main><header class="hero"><div class="eyebrow">MEIMEI CITY · URBAN LEGENDS DIVISION</div><h1>ふたりの記録</h1><div class="sub">迷冥市役所 都市伝説課 ／ 膝髭・自卓IFシミュレーション</div></header>
<section id="start" class="panel"><h2>物語のはじまり</h2><p class="sub">提供された卓ログを参考にした、オリジナルのランダム日常・事件シミュレーターです。シナリオ本文の再現ではありません。ネタバレを含む設定があります。</p><label>視点<select id="pov"><option value="h">大覚 膝丸（先輩）</option><option value="s">獅子の子（獅子吼 阿呼）</option></select></label><label>物語の分岐<select id="route"><option value="end5">自卓オリジナルルート後：二人で一つの「職員さん」</option><option value="if">事件の合間のIF：二人が共に勤務する日々</option></select></label><label><input type="checkbox" id="night" checked> 夜の親密な描写（暗転・余韻）を含む</label><label><input type="checkbox" id="risk" checked> 怪異による負傷・喪失の危険を含む</label><div class="controls"><button class="primary" id="new">新しく始める</button><button id="resume">前回の続きから</button></div><p id="notice"></p></section>
<section id="game" class="hidden"><div class="panel"><div class="row"><div><b id="day">1日目</b> <span class="badge" id="period">朝</span></div><span class="badge" id="relationship">都市伝説課の相棒</span></div><p class="sub" id="routeLabel"></p><div class="row"><span id="povLabel"></span><span class="sub">相手の心は、本人にしか分からない。</span></div><div id="stats"></div><div class="controls"><button id="pause">▶ 再開</button><button id="speed">1×</button><button id="nextday">1日進める</button><button id="save">保存</button><button id="export">記録を書き出す</button></div></div><div class="panel" id="scene"><div class="sub" id="sceneMeta"></div><div class="eventtitle" id="sceneTitle"></div><div class="story" id="sceneBody"></div><div id="choices" class="choices"></div></div><div class="panel"><div class="row"><h2>出来事の記録</h2><span class="sub" id="count"></span></div><div class="log" id="log"></div></div><div class="panel"><h2>物語の設定</h2><label><input type="checkbox" id="riskInGame"> 危険な事件・喪失を有効にする</label><label><input type="checkbox" id="nightInGame"> 夜の親密な場面を有効にする</label><button id="restart" class="small">別の周回を始める</button></div></section><p class="footer">個人用ファンメイド・自卓ログをもとにしたIF作品／元シナリオ・公式とは無関係</p></main>
<script>
(()=>{'use strict';const KEY='meimei_hizahige_personal_v1', $=id=>document.getElementById(id), rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a, pick=a=>a[rnd(0,a.length-1)], clamp=n=>Math.max(0,Math.min(100,Math.round(n)));let s=null,timer=null,waiting=false;const names={h:'大覚 膝丸',s:'獅子の子'};
const events=[
{id:'tea',title:'湯呑みを二つ',type:'normal',weight:9,place:'都市伝説課',body:['御先稲荷が菓子を置いていった。二人分の茶を淹れると、慌ただしい一日が少しだけ緩む。','給湯室の湯気の向こう、相棒が今日の予定を尋ねた。なんでもない返事が、妙に心地よい。'],talk:[['「少し休むか。まだ時間はある」','「うん、先輩も一緒にね」'],['「茶を淹れた。熱いから気をつけてくれ」','「ありがとう。こういう時間、好きだな」']],effect:{trust:5,stress:-8}},
{id:'files',title:'未整理の報告書',type:'normal',weight:9,place:'執務室',body:['積み上がった資料の山。先に帰ったはずの相棒が、気づけば隣で書類を揃えていた。','依頼の記録を整理する。見覚えのない付箋には、相棒の丁寧な字が残っている。'],talk:[['「手伝ってくれるのか。助かる」','「もちろん。二人でやった方が早いでしょう？」']],effect:{trust:4,stress:5}},
{id:'kisaragi',title:'きさらぎの一言',type:'normal',weight:7,place:'廊下',body:['きさらぎが意味ありげに笑う。「二人とも、最近ずいぶん息が合ってるね」　何を知っているのか、聞いても答えは曖昧だった。','きさらぎが事件の資料を置いていった。余白には「無理しないこと」とだけ書かれている。'],effect:{trust:3,awareness:3}},
{id:'misaki',title:'御先稲荷のおやつ',type:'normal',weight:7,place:'休憩室',body:['御先稲荷に呼び止められ、三人で菓子を分けた。事件の話は今日はなし、という約束になった。','御先稲荷が二人の顔を見比べる。「ちゃんと休んでる？」　鋭い問いに、返事が少し遅れる。'],effect:{stress:-12,trust:4}},
{id:'train',title:'装備の点検',type:'normal',weight:6,place:'資料室',body:['薄緑と蜘蛛切の手入れをする先輩の隣で、相棒が装備を確かめている。互いの手際を知っていることが心強い。','出発前、相棒の装備に緩みがないか確認する。言葉にしなくても、気遣いは伝わるらしい。'],effect:{trust:5,stress:4}},
{id:'sweet',title:'駄菓子屋の帰り道',type:'normal',weight:6,place:'商店街',body:['買い物袋からモロッコヨーグルが覗く。好みを覚えていたことを指摘され、なんとなく照れくさくなった。','任務帰りに寄った店で、二人は子供のように駄菓子を選んだ。迷冥市の夕焼けが、やけに穏やかだった。'],effect:{trust:6,love:3,stress:-9}},
{id:'rain',title:'雨宿り',type:'normal',weight:7,place:'路地裏',body:['突然の雨に足を止める。小さな軒先で並ぶと、肩が触れそうな距離になった。','濡れた前髪を払う相棒を見て、タオルを差し出す。雨音の中で小さな礼が返ってきた。'],effect:{love:5,trust:4}},
{id:'nightwork',title:'終電のあと',type:'normal',weight:5,place:'執務室',body:['時計はとっくに日付を越えている。相棒が眠そうに瞬きをするのを見て、今日は切り上げようと決めた。','残業を終えた二人が廊下に出る。誰もいない庁舎では、足音が不思議なほど響いた。'],effect:{stress:10,trust:3}},
{id:'rumor',title:'噂の調査',type:'mystery',weight:9,place:'迷冥市内',body:['誰もいない階段から足音がするという。聞き込みを終えた二人は、同時に同じ結論へ辿り着いた。','夜の電話に、誰も話していないはずの声が混じる。相棒と目を合わせ、静かに受話器を置いた。','忘れられた公園の噂を追う。子供の笑い声が聞こえた気がしたが、振り返っても誰もいなかった。'],effect:{trust:6,stress:12}},
{id:'school',title:'学校からの相談',type:'mystery',weight:6,place:'校舎',body:['校舎の窓に、誰かの影が映る。相棒がそっと手で合図した。調査は慎重に進めることにした。','学校に残された古い記録を調べる。ページの隅に、今は使われていない名前が書かれていた。'],effect:{trust:5,stress:9}},
{id:'call',title:'名前を呼ぶ',type:'romance',weight:5,place:'帰り道',minLove:30,body:['雑踏の中で呼び止められた。振り返ると、相棒はいつもより真剣な顔をしていた。','ただ名前を呼ばれただけなのに、胸の奥が温かくなる。理由を尋ねるには、まだ少し勇気がいる。'],talk:[['「……獅子の子」','「なあに、先輩」'],['「君が無事でよかった」','「うん。先輩もね」']],effect:{love:10,awareness:6}},
{id:'protect',title:'庇った背中',type:'danger',weight:4,place:'現場',risk:true,body:['怪異の気配が迫る。考えるより先に身体が動き、相棒を背に庇った。後になって手の震えに気づく。','一瞬の判断で相棒が前に出た。無事だと分かってからも、胸のざわめきは消えなかった。'],effect:{trust:12,love:9,stress:19,hp:-13}},
{id:'injury',title:'消えない傷',type:'danger',weight:3,place:'医務室',risk:true,body:['帰還した相棒の袖に血が滲んでいた。手当てをしながら、無理をするなと何度も繰り返した。','痛みを隠していたことを見抜かれた。叱る声が震えているのに気づき、返す言葉が見つからない。'],effect:{trust:8,love:9,stress:16,hp:-18}},
{id:'disagree',title:'食い違う判断',type:'conflict',weight:5,place:'執務室',body:['現場での判断を巡り、二人の意見がぶつかった。正しさだけでは埋まらない距離がある。','「危険を承知で動くべきではない」　心配から出た言葉が、責めるように響いてしまった。'],effect:{conflict:16,trust:-9,stress:8}},
{id:'silence',title:'言葉のない帰路',type:'conflict',weight:4,place:'夜道',minConflict:18,body:['今日は会話が少ない。いつもなら気にならない信号待ちが、ひどく長く感じられた。','声をかけようとして、やめる。気まずさの理由を、二人ともまだ言葉にできない。'],effect:{conflict:8,trust:-4,stress:5}},
{id:'apology',title:'遅い謝罪',type:'romance',weight:6,place:'庁舎裏',minConflict:20,body:['先に口を開いたのは相棒だった。互いの心配をようやく言葉にできた夜、肩の力が抜けていく。','言い過ぎたことを認めると、相棒は困ったように笑った。許しの言葉は思ったよりも温かかった。'],effect:{conflict:-24,trust:13,love:7,stress:-8}},
{id:'jealous',title:'胸の棘',type:'conflict',weight:4,place:'休憩室',minLove:42,body:['相棒が他の職員と親しげに話している。安心しているはずなのに、胸の奥が少しだけ落ち着かない。','理由の分からない不機嫌を悟られたくなくて、普段より早く席を立った。'],effect:{love:7,awareness:7,conflict:10}},
{id:'confess',title:'帰り道の告白',type:'romance',weight:5,place:'夜の橋',minLove:70,minAwareness:55,minTrust:55,preLove:true,body:['街灯の下で足を止めた。何度も言いかけた言葉を、今夜こそ伝えようと思った。','「大切だ」という言葉では足りない。隣にいる人を、ただの相棒以上に想っている。'],effect:{love:6,awareness:9},choice:true},
{id:'hand',title:'手を重ねる',type:'romance',weight:5,place:'帰宅途中',minLove:45,body:['冷えた指先に、そっと温もりが重なった。離す理由を、どちらも探さなかった。','人混みではぐれそうになった手を掴む。そのまま少しだけ歩いた。'],effect:{love:9,trust:6,awareness:6}},
{id:'night',title:'夜の約束',type:'romance',weight:4,place:'部屋',onlyCouple:true,night:true,body:['明かりを落とした部屋で、二人は今日の出来事を語り合った。やがて言葉は途切れ、互いの温もりだけが残る。夜は静かに更けていった。','肩を寄せ合い、確かめるように口づける。窓の外で雨が降り始めた。続きは、二人だけが知っている。'],effect:{love:8,trust:8,stress:-12}},
{id:'morning',title:'二人で迎える朝',type:'romance',weight:5,place:'朝の部屋',onlyCouple:true,body:['目覚めると、相棒の寝息がすぐ近くにあった。いつもの朝が少し特別になった気がする。','同じ食卓で朝食をとる。何を話しても、何も話さなくても、心地よい。'],effect:{love:7,trust:8,stress:-11}},
{id:'promise',title:'明日もここで',type:'romance',weight:4,place:'市役所前',onlyCouple:true,body:['「明日も一緒に帰ろう」　そんな当たり前の約束が、今は何より大切だった。','二人で一つの噂。けれど、一緒に過ごす一日はいつも新しい。'],effect:{love:6,trust:7}},
{id:'memory',title:'噂の中のふたり',type:'mystery',weight:4,place:'都市伝説課',end5:true,body:['「困ったら二人組の職員を訪ねるといい」　そんな噂がまた一つ街に広がっていた。','自分たちの噂を聞く。少し大げさな話だったが、二人が共にいるという部分だけは本当だ。'],effect:{trust:6,stress:4}},
{id:'quiet',title:'何も起こらない日',type:'normal',weight:12,place:'迷冥市',body:['事件の連絡はなかった。二人は書類を片づけ、定時を少し過ぎてから帰路についた。','特別なことは何もなかった。それでも、無事に一日が終わることをありがたく思う。','昼休みに同じ窓から空を見上げる。迷冥市にも、静かな日がある。'],effect:{stress:-13,trust:2}}
];
function fresh(){return {day:1,pov:$('pov').value,route:$('route').value,night:$('night').checked,risk:$('risk').checked,couple:false,ended:false,paused:true,speed:1,log:[],lastIds:[],h:{love:22,awareness:13,trust:57,conflict:8,stress:12,hp:100},s:{love:26,awareness:18,trust:57,conflict:8,stress:10,hp:100}}}
function save(){if(s)localStorage.setItem(KEY,JSON.stringify(s))}function start(){if(!s)return;$('start').classList.add('hidden');$('game').classList.remove('hidden');$('riskInGame').checked=s.risk;$('nightInGame').checked=s.night;render();clock()}
function clock(){clearInterval(timer);if(!s||s.paused||s.ended||waiting)return;timer=setInterval(step,8000/s.speed)}
function change(p,eff){for(const [k,v] of Object.entries(eff)){if(k==='hp')p.hp=clamp(p.hp+v);else if(k in p)p[k]=clamp(p[k]+v)}}
function logEvent(e,body){s.log.unshift({day:s.day,title:e.title,body,type:e.type});if(s.log.length>650)s.log.pop();s.lastIds.unshift(e.id);s.lastIds=s.lastIds.slice(0,6)}
function eventFor(){let pool=events.filter(e=>!((e.risk&&!s.risk)||(e.night&&!s.night)||(e.end5&&s.route!=='end5')||(e.onlyCouple&&!s.couple)||(e.preLove&&s.couple)||(e.minLove&&Math.max(s.h.love,s.s.love)<e.minLove)||(e.minAwareness&&Math.max(s.h.awareness,s.s.awareness)<e.minAwareness)||(e.minTrust&&Math.min(s.h.trust,s.s.trust)<e.minTrust)||(e.minConflict&&Math.max(s.h.conflict,s.s.conflict)<e.minConflict)));if(s.couple)pool=pool.filter(e=>e.id!=='confess');let total=0;const weighted=pool.map(e=>{let w=e.weight*(s.lastIds.includes(e.id)?.12:1);if(e.id==='confess')w*=s.day<25?.15:1;if(e.type==='romance'&&!s.couple)w*=.8;if(e.type==='mystery'&&s.day%5===0)w*=1.5;total+=w;return [e,total]});let r=Math.random()*total;return weighted.find(x=>r<x[1])[0]||pool[0]}
function describe(e){let body=pick(e.body);if(e.talk&&Math.random()<.6){let pair=pick(e.talk);body+='\n\n'+(s.pov==='h'?pair.join('\n'):pair.slice().reverse().join('\n'))}if(s.pov==='h'&&e.type==='romance')body+='\n\n膝丸は、その言葉の意味を考えずにはいられなかった。';if(s.pov==='s'&&e.type==='romance')body+='\n\n獅子の子は、先輩の横顔をそっと見つめた。';return body}
function step(){if(!s||s.ended||waiting)return;s.day++;const a=s.h,b=s.s;for(const p of [a,b]){p.stress=clamp(p.stress+rnd(-9,7));if(p.stress>75&&s.risk&&Math.random()<.13)p.hp=clamp(p.hp-rnd(6,18));if(p.stress<30)p.hp=clamp(p.hp+rnd(2,6));if(p.conflict>0&&Math.random()<.24)p.conflict=clamp(p.conflict-rnd(1,6))}let e=eventFor(),body=describe(e),eff=e.effect||{};change(a,eff);change(b,Object.fromEntries(Object.entries(eff).map(([k,v])=>[k,Math.round(v*(.6+Math.random()*.75))])));if(e.type==='romance'){a.love=clamp(a.love+rnd(0,4));b.love=clamp(b.love+rnd(0,4))}if(e.id==='confess'&&!s.couple){waiting=true;s.paused=true;body+='\n\nこの瞬間だけ、あなたの言葉を選べる。';s.pending=true}else if(s.risk&&Math.min(a.hp,b.hp)<=0){s.ended=true;s.paused=true;e={...e,title:'噂の途絶えた夜',type:'danger'};body='事件から戻らなかった相棒の名を、何度も呼んだ。返事はない。\n\n迷冥市の噂は、時に残酷な結末を迎える。\n\nこの周回はここで終わる。'}logEvent(e,body);render(e,body);save();clock()}
function answer(accept){waiting=false;s.pending=false;let a=s.h,b=s.s,success=accept&&Math.min(a.love,b.love)>48&&Math.min(a.trust,b.trust)>40&&Math.max(a.conflict,b.conflict)<65&&Math.random()<.86;let e={id:'choice',type:success?'romance':'conflict',title:success?'ふたりの約束':accept?'まだ言えない答え':'言葉を飲み込んで'};let body;if(success){s.couple=true;body='返事を待つ時間は長く感じられた。\n\nやがて相棒が手を取り、ゆっくり頷いた。\n\n「これからも、一緒にいよう」\n\n都市伝説課の二人は、今日から恋人としても歩き始める。';change(a,{love:18,trust:20,conflict:-25});change(b,{love:18,trust:20,conflict:-25})}else if(accept){body='伝えた想いは届いた。それでも、答えを急がせたくはなかった。\n\n「少しだけ、考える時間をくれる？」';change(a,{conflict:8,awareness:8});change(b,{awareness:7})}else{body='言葉は喉元で止まった。今夜はまだ、胸にしまっておく。\n\nいつか伝えられるだろうか。';change(a,{awareness:6,conflict:5})}logEvent(e,body);s.paused=false;render(e,body);save();clock()}
function render(e,body){if(!s)return;$('day').textContent=s.day+'日目';$('period').textContent=['朝','昼','夕','夜'][s.day%4];$('relationship').textContent=s.ended?'喪失':s.couple?'恋仲':'都市伝説課の相棒';$('routeLabel').textContent=s.route==='end5'?'自卓オリジナルルート後 ／ 二人で一つの「職員さん」':'事件の合間のIF ／ 都市伝説課で働く二人';$('povLabel').textContent='視点：'+names[s.pov];$('pause').textContent=s.paused?'▶ 再開':'Ⅱ 一時停止';$('speed').textContent=s.speed+'×';$('riskInGame').checked=s.risk;$('nightInGame').checked=s.night;let p=s[s.pov];$('stats').innerHTML=[['恋心','love'],['恋の自覚','awareness'],['信頼','trust'],['すれ違い','conflict'],['疲労','stress'],['体力','hp']].map(([label,k])=>`<div class="barrow"><span>${label}</span><div class="track"><div class="fill ${k==='love'?'love':k==='conflict'?'conflict':k==='stress'?'stress':''}" style="width:${p[k]}%"></div></div><span>${p[k]}</span></div>`).join('');let last=s.log[0];if(!e&&last){e={title:last.title,type:last.type};body=last.body}if(!e){e={title:'ようこそ、都市伝説課へ',type:'normal'};body='庁舎の奥にある小さな部署。\n今日も二人の職員が、迷冥市の不思議な噂と向き合っている。\n\n再生を押すと日々が進みます。'}$('scene').className='panel '+(e.type==='romance'?'important romance':e.type==='conflict'?'important conflict':e.type==='danger'?'important danger':'');$('sceneMeta').textContent=s.day+'日目 ／ '+(e.place||'迷冥市');$('sceneTitle').textContent=e.title;$('sceneBody').textContent=body;$('choices').innerHTML='';if(waiting||s.pending){waiting=true;s.paused=true;for(const [text,yes] of [['想いを伝える',true],['今は胸にしまう',false]]){let b=document.createElement('button');b.textContent=text;b.onclick=()=>answer(yes);$('choices').appendChild(b)}}$('count').textContent=s.log.length+'件';$('log').innerHTML='';for(const l of s.log.slice(0,80)){let d=document.createElement('div');d.className='entry '+l.type;let b=document.createElement('b');b.textContent=l.day+'日目・'+l.title;let p=document.createElement('div');p.textContent=l.body.length>125?l.body.slice(0,125)+'…':l.body;d.append(b,p);$('log').appendChild(d)}$('nextday').disabled=waiting||s.ended;$('pause').disabled=waiting||s.ended}
$('new').onclick=()=>{s=fresh();save();start()};$('resume').onclick=()=>{try{let v=JSON.parse(localStorage.getItem(KEY));if(!v||!v.h||!v.s)throw Error();s=v;s.paused=true;waiting=!!s.pending;start()}catch{$('notice').textContent='保存されたデータが見つかりません。'}};$('pause').onclick=()=>{s.paused=!s.paused;render();save();clock()};$('speed').onclick=()=>{s.speed={1:2,2:4,4:1}[s.speed];render();save();clock()};$('nextday').onclick=()=>{if(!waiting&&!s.ended)step()};$('save').onclick=()=>{save();$('save').textContent='保存しました';setTimeout(()=>$('save').textContent='保存',900)};$('riskInGame').onchange=e=>{s.risk=e.target.checked;save()};$('nightInGame').onchange=e=>{s.night=e.target.checked;save()};$('restart').onclick=()=>{if(!confirm('新しい周回を始めますか？ 現在のセーブは上書きされます。'))return;clearInterval(timer);s=null;waiting=false;$('game').classList.add('hidden');$('start').classList.remove('hidden')};$('export').onclick=()=>{let txt=['迷冥市役所 都市伝説課｜ふたりの記録',s.route==='end5'?'自卓オリジナルルート後':'事件の合間のIF','視点：'+names[s.pov],''].concat(s.log.slice().reverse().map(x=>`${x.day}日目　${x.title}\n${x.body}\n`)).join('\n');let blob=new Blob([txt],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='都市伝説課_ふたりの記録.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)};if(!localStorage.getItem(KEY))$('resume').disabled=true;
})();
</script></body></html>
